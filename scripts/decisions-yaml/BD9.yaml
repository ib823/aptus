# Scope item BD9 - Sell from Stock
# Tier 1 decisions for the Fit-to-Standard pre-onboarding workbench
# Sell-from-Stock is the workhorse O2C scenario - most common path

decisions:
  - id: d1
    title: Sales order document type
    summary: >
      SAP delivers a standard order type (OR). Do you need additional order
      types (e.g., "Cash Sale", "Rush Order", "Consignment Order")?
    sscui: "102495 - Configure Sales Document Types"
    sscui_id: "102495"
    sscui_name: "Configure Sales Document Types"
    std_desc: Use SAP standard order type OR. Single type covers most cases.
    cfg_desc: Add additional order types via SSCUI (e.g., Cash Sale, Rush Order). Included.
    cst_desc: Custom order type with custom fields, logic, integrations. ~4-6 days.
    effort: 5
    custom_type: "Key User Extensibility + Custom Sales Doc Type"
    ext_impact: "Medium - custom fields need regression test each release"
    ricefw_class: "E (Enhancement)"

  - id: d2
    title: Order number ranges
    summary: How should sales orders be numbered? Internal sequential vs external prefix pattern?
    sscui: "102819 - Define Number Ranges for Sales Documents"
    sscui_id: "102819"
    sscui_name: "Define Number Ranges for Sales Documents"
    std_desc: Accept SAP standard internal numbering. Simple, fast.
    cfg_desc: Define custom number ranges per order type or company code (e.g., year prefix). Included.
    cst_desc: Number generation logic tied to external system or legacy migration scheme. ~2 days.
    effort: 2
    custom_type: "Developer Extensibility (custom number range BAdI)"
    ext_impact: "Medium - BAdI implementation, retest on each release"
    ricefw_class: "E (Enhancement)"

  - id: d3
    title: Availability check policy
    summary: >
      How strict should the availability check be? Block order creation if stock
      not available? Allow partial confirmation?
    sscui: "Availability Check Configuration (ATP)"
    sscui_id: "ATP"
    sscui_name: "Availability Check / ATP Configuration"
    std_desc: Standard ATP check. Stock confirmed; partial deliveries allowed.
    cfg_desc: Configure checking group, scope of check, backorder behavior via SSCUI. Included.
    cst_desc: Advanced ATP / external availability check / custom allocation logic. ~6 days.
    effort: 6
    custom_type: "Developer Extensibility + advanced ATP / external integration"
    ext_impact: "High - touches all order flows, full regression each release"
    ricefw_class: "I (Interface)"

  - id: d4
    title: Credit management at order
    summary: >
      Should orders be checked against customer credit limits? Block on failure?
      Auto-route to approver?
    sscui: "Credit Management Configuration"
    sscui_id: "CM"
    sscui_name: "Credit Management - Risk Categories, Limits, Blocks"
    std_desc: No automatic credit check. Manual review by AR team.
    cfg_desc: Enable standard credit check with risk categories and block-on-fail. Included.
    cst_desc: Multi-stage credit workflow with custom risk scoring and external credit bureau integration. ~7 days.
    effort: 7
    custom_type: "Workflow Developer Extension + Credit Bureau Integration"
    ext_impact: "High - external system + multi-stage logic, full retest"
    ricefw_class: "I (Interface)"

  - id: d5
    title: Pricing manual override
    summary: >
      Can sales reps manually override pricing on individual line items? Who can
      approve discounts above a threshold?
    sscui: "Pricing Procedure Configuration"
    sscui_id: "PR"
    sscui_name: "Pricing Procedure - Manual Pricing, Approval"
    std_desc: Standard pricing locked. Discounts only via approved condition records.
    cfg_desc: Enable manual price override with approval workflow above threshold. Included.
    cst_desc: Custom approval routing based on customer tier, product, region. ~5 days.
    effort: 5
    custom_type: "Flexible Workflow + Key User Extensibility"
    ext_impact: "Medium-High - approval logic + custom routing"
    ricefw_class: "W (Workflow)"

  - id: d6
    title: Order confirmation output
    summary: When an order is saved, should it auto-send confirmation to the customer? Format and channel?
    sscui: "Output Management Configuration"
    sscui_id: "OM"
    sscui_name: "Output Management - Order Confirmation"
    std_desc: Manual output. Rep clicks Print/Email when needed.
    cfg_desc: Auto-email order confirmation using standard SAP form template. Included.
    cst_desc: Custom-branded PDF, multilingual, with company-specific fields and conditional content. ~4 days per variant.
    effort: 4
    custom_type: "Adobe Forms (Form Template) + Key User Extensibility"
    ext_impact: "Low - form templates are upgrade-stable"
    ricefw_class: "F (Form)"

  - id: d7
    title: Delivery split / consolidation
    summary: >
      Should one order generate one delivery, or split by plant/shipping point?
      Allow customer-side consolidation across multiple orders?
    sscui: "Delivery Split Configuration"
    sscui_id: "DS"
    sscui_name: "Delivery Split & Consolidation Rules"
    std_desc: Standard delivery split rules (per plant, per ship-to). One order may produce multiple deliveries.
    cfg_desc: Adjust split criteria via SSCUI (e.g., consolidate by customer regardless of plant). Included.
    cst_desc: Custom split logic based on customer preference, carrier, route, or schedule. ~4 days.
    effort: 4
    custom_type: "Developer Extensibility (delivery split BAdI)"
    ext_impact: "Medium - delivery flow regression each release"
    ricefw_class: "E (Enhancement)"

  - id: d8
    title: Order approval workflow
    summary: >
      Do high-value orders need management approval before going to fulfillment?
      Threshold-based, customer-based, or product-based?
    sscui: "Flexible Workflow for Sales Documents"
    sscui_id: "FW"
    sscui_name: "Flexible Workflow Configuration - Sales Orders"
    std_desc: No approval required. Orders flow directly to fulfillment.
    cfg_desc: Enable SAP Flexible Workflow with value-threshold approval. Included.
    cst_desc: Multi-stage approval with custom criteria (margin, product, customer tier) and external escalation. ~8 days.
    effort: 8
    custom_type: "Workflow Developer Extension + Integration"
    ext_impact: "High - multi-stage logic + external integration, full retest each release"
    ricefw_class: "W (Workflow)"
