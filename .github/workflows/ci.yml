name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fit_portal_test
  DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fit_portal_test
  NEXTAUTH_SECRET: ci-test-secret-key-minimum-32-characters-long
  NEXTAUTH_URL: http://localhost:3003
  TOTP_ENCRYPTION_KEY: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
  TOTP_ISSUER: ABeam

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fit_portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Security audit
        run: pnpm audit --prod --audit-level=high

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Push database schema
        run: pnpm db:push

      - name: TypeScript strict check
        run: pnpm typecheck:strict

      - name: ESLint strict check
        run: pnpm lint:strict

      - name: Unit tests
        run: pnpm test --run

      - name: Production build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Automated accessibility gate
        run: pnpm test:a11y

  # E2E tests run locally only — use `pnpm test:e2e` to run with Playwright
