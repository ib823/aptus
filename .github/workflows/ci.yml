name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fit_portal_test
  DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fit_portal_test
  NEXTAUTH_SECRET: ci-test-secret-key-minimum-32-characters-long
  NEXTAUTH_URL: http://localhost:3003
  TOTP_ENCRYPTION_KEY: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
  TOTP_ISSUER: ABeam

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fit_portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # setup-node's `cache: pnpm` covers the store only — every `pnpm build`
      # in this workflow was fully cold. Restoring .next/cache lets Next.js
      # reuse compilation output across runs.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'prisma/schema.prisma', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Security audit
        # Resilient gate (scripts/ci-audit-gate.mjs): FAILS on any DIRECT-dep or
        # FIXABLE high/critical (a fixable transitive CVE like fast-uri still
        # fails — Dependabot raises the override PR, which auto-merges, and open
        # PRs rebase onto a green main). Only a genuinely-UNFIXABLE transitive
        # advisory (no patched version) is downgraded to a warning, so it can't
        # hard-block every build. Retired/unavailable audit endpoint → warning.
        run: node scripts/ci-audit-gate.mjs

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Push database schema
        run: pnpm db:push

      - name: TypeScript strict check
        run: pnpm typecheck:strict

      - name: ESLint strict check
        run: pnpm lint:strict

      - name: Unit tests
        run: pnpm test --run

      - name: Production build
        run: pnpm build

  e2e-smoke:
    name: E2E Smoke
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fit_portal_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fit_portal_test
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fit_portal_test

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'prisma/schema.prisma', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Push database schema
        run: pnpm db:push

      - name: Build app for Playwright
        run: pnpm build

      - name: Run Playwright smoke suite
        run: pnpm test:e2e:smoke

      # Neutral-discovery consultant surfaces are flag-gated and run on the
      # `consultant` project, so the smoke suite above never touches them. This
      # step boots the app with the flag on and DISCOVERY_E2E=1 so the C7
      # "New session" spec actually executes — the PR-5 gap where the entry
      # point to the client workflow shipped without a route and no CI ran it.
      - name: Run discovery session e2e
        run: pnpm test:e2e:discovery-session
        env:
          NEUTRAL_DISCOVERY_ENABLED: "true"
          DISCOVERY_E2E: "1"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore

  visual-regression:
    name: Visual Regression (report mocks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Playwright image is pinned by SHA digest (not just the mutable
    # v1.58.2-noble tag) so font / sub-pixel rendering is byte-stable across
    # image rebuilds. The committed baselines were regenerated from exactly
    # this digest (pnpm test:visual:update). If Microsoft rebuilds the tag,
    # this job keeps using the pinned image, so it stays deterministic and
    # blocking. To intentionally move to a newer image: bump the digest AND
    # refresh baselines in the same commit. See CONTRIBUTING.md
    # "Visual regression — image drift" for the runbook.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --ipc=host

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No DB, no Next.js build — mocks are static HTML served via file://
      - name: Run visual-regression suite
        run: pnpm test:visual

      - name: Upload diff images on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-diffs
          path: |
            test-results/
            playwright-visual-report/
          if-no-files-found: ignore

  visual-regression-app:
    name: Visual Regression (live app)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host

    steps:
      - uses: actions/checkout@v7

      # Determine baseline presence BEFORE setting up Node/pnpm caching: with no
      # baselines committed the job is a no-op, but actions/setup-node
      # (cache: pnpm) with no subsequent install leaves its post-job cache-save
      # step nothing to save — which fails the whole job ("Path Validation
      # Error"). Gating the toolchain on the check keeps the no-baselines path
      # cleanly green.
      - name: Check that baselines exist
        id: check-baselines
        shell: bash
        run: |
          set +e
          DIR="tests/visual-regression-app/redesigned-screens.spec.ts-snapshots"
          HAS=false
          if [ -d "$DIR" ] && [ -n "$(ls -A "$DIR" 2>/dev/null || true)" ]; then
            HAS=true
          fi
          echo "have_baselines=$HAS" >> "$GITHUB_OUTPUT"
          if [ "$HAS" = "true" ]; then
            echo "Baselines present — running visual-app suite."
          else
            echo "::warning::No visual-app baselines committed. Generate with 'pnpm test:visual-app:update' and commit snapshots; skipping run."
          fi
          exit 0

      - uses: pnpm/action-setup@v6
        if: steps.check-baselines.outputs.have_baselines == 'true'

      - uses: actions/setup-node@v7
        if: steps.check-baselines.outputs.have_baselines == 'true'
        with:
          node-version: 22.22.1
          cache: pnpm

      - name: Install dependencies
        if: steps.check-baselines.outputs.have_baselines == 'true'
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        if: steps.check-baselines.outputs.have_baselines == 'true'
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'prisma/schema.prisma', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Generate Prisma client
        if: steps.check-baselines.outputs.have_baselines == 'true'
        run: pnpm db:generate

      - name: Build app
        if: steps.check-baselines.outputs.have_baselines == 'true'
        run: pnpm build

      - name: Run visual-app suite
        if: steps.check-baselines.outputs.have_baselines == 'true'
        run: pnpm test:visual-app

      - name: Upload diff images on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-app-diffs
          path: |
            test-results/
            playwright-visual-app-report/
          if-no-files-found: ignore
