[project]
name = "abap-mcp"
version = "0.2.0"
description = "Proprietary MCP server for ABAP remediation via ADT REST APIs"
requires-python = ">=3.11"
dependencies = [
    # UPPER BOUND IS LOAD-BEARING. The 2.0 SDK moved `mcp.server.fastmcp`;
    # server.py imports it, so `pip install mcp` unpinned resolves to 2.x and
    # every import fails with ModuleNotFoundError. Found by installing the
    # latest and watching all 73 tests fail to collect — not by reading a
    # changelog. Re-test before raising this ceiling.
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
